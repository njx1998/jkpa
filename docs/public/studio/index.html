<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>整站视觉调参面板 · jkpa 的博客</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f6f6f7;
    color: #1f2024;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 18px; border-bottom: 1px solid #e3e3e8; background: #fff; flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .hint { font-size: 12px; color: #82828c; }
  header .spacer { flex: 1; }
  header a { font-size: 12px; color: #646cff; text-decoration: none; border: 1px solid #d9d8ff; border-radius: 6px; padding: 4px 10px; }
  main { flex: 1; display: flex; min-height: 0; }
  .panel { width: 330px; flex-shrink: 0; background: #fff; border-right: 1px solid #e3e3e8; overflow-y: auto; padding: 14px 16px 36px; }
  h2 { font-size: 12px; font-weight: 600; color: #82828c; letter-spacing: .04em; margin: 20px 0 10px; }
  h2:first-of-type { margin-top: 4px; }
  .group { margin-bottom: 14px; }
  .group > label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .group .val { font-size: 11.5px; color: #646cff; font-family: ui-monospace, monospace; font-weight: 400; }
  .group .desc { font-size: 11px; color: #9b9ba4; margin-top: 3px; line-height: 1.5; }
  input[type="range"] { width: 100%; accent-color: #646cff; }
  input[type="color"] { width: 100%; height: 32px; border: 1px solid #e3e3e8; border-radius: 8px; padding: 2px; background: #fff; cursor: pointer; }
  select { width: 100%; height: 32px; border: 1px solid #e3e3e8; border-radius: 8px; padding: 0 8px; font-size: 13px; background: #fff; color: #1f2024; }
  .swatches { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .swatches button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #e3e3e8; cursor: pointer; padding: 0; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .row input[type="checkbox"] { accent-color: #646cff; width: 15px; height: 15px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: flex; border: 1px solid #e3e3e8; border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; height: 30px; border: 0; background: #fff; font-size: 12.5px; cursor: pointer; color: #55555e; }
  .seg button.on { background: #646cff; color: #fff; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button { flex: 1; height: 34px; border-radius: 8px; border: 1px solid #e3e3e8; background: #fff; font-size: 13px; cursor: pointer; color: #1f2024; }
  .actions button.primary { background: #646cff; border-color: #646cff; color: #fff; }
  .actions button:hover { opacity: .88; }
  textarea { width: 100%; height: 190px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.6; border: 1px solid #e3e3e8; border-radius: 8px; padding: 8px 10px; resize: vertical; background: #fafafa; color: #1f2024; margin-top: 10px; }
  .preview { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #ececed; }
  .preview .bar { height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 12px; color: #82828c; background: #fff; border-bottom: 1px solid #e3e3e8; flex-shrink: 0; }
  .preview .bar select { width: 150px; height: 24px; font-size: 12px; }
  .preview iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px); background: #1f2024; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>整站视觉调节</h1>
  <span class="hint">左调右看，导出 CSS 保存即生效</span>
  <span class="spacer"></span>
  <a href="../" target="_blank" rel="noopener">打开博客 ↗</a>
</header>

<main>
  <aside class="panel">
    <h2>全局配色</h2>
    <div class="group">
      <label>主色调 <span class="val" id="v-brand">#646cff</span></label>
      <input type="color" id="brand" value="#646cff" />
      <div class="swatches">
        <button data-color="#646cff" style="background:#646cff" title="紫蓝"></button>
        <button data-color="#0f6e56" style="background:#0f6e56" title="墨绿"></button>
        <button data-color="#d85a30" style="background:#d85a30" title="暖橙"></button>
        <button data-color="#d4537e" style="background:#d4537e" title="莓红"></button>
        <button data-color="#185fa5" style="background:#185fa5" title="海蓝"></button>
        <button data-color="#2c2c2a" style="background:#2c2c2a" title="极简黑"></button>
      </div>
    </div>

    <div class="group">
      <label>当前编辑</label>
      <div class="seg" id="colorMode">
        <button data-mode="light" class="on">浅色模式</button>
        <button data-mode="dark">深色模式</button>
      </div>
      <div class="desc">右侧预览会同步切换深浅模式</div>
    </div>

    <div class="grid2">
      <div class="group">
        <label>页面背景 <span class="val" id="v-bg"></span></label>
        <input type="color" id="cBg" />
      </div>
      <div class="group">
        <label>区块背景 <span class="val" id="v-bgAlt"></span></label>
        <input type="color" id="cBgAlt" />
      </div>
      <div class="group">
        <label>文字颜色 <span class="val" id="v-text"></span></label>
        <input type="color" id="cText" />
      </div>
      <div class="group">
        <label>导航背景 <span class="val" id="v-navBg"></span></label>
        <input type="color" id="cNavBg" />
      </div>
    </div>

    <h2>导航栏</h2>
    <div class="group">
      <label>导航高度 <span class="val" id="v-navHeight">64px</span></label>
      <input type="range" id="navHeight" min="48" max="88" step="2" value="64" />
    </div>

    <h2>首页 hero</h2>
    <div class="group">
      <label>背景图透明度 <span class="val" id="v-opacity">0.22</span></label>
      <input type="range" id="opacity" min="0" max="0.6" step="0.01" value="0.22" />
    </div>
    <div class="group">
      <label>轮播一圈时长 <span class="val" id="v-speed">32s</span></label>
      <input type="range" id="speed" min="8" max="64" step="2" value="32" />
      <div class="desc">每张停留 = 时长 ÷ 4</div>
    </div>
    <div class="group">
      <label>背景圆角 <span class="val" id="v-radius">16px</span></label>
      <input type="range" id="radius" min="0" max="32" step="1" value="16" />
    </div>
    <div class="group">
      <label>首页右侧大图</label>
      <select id="hero">
        <option value="1">bg1</option>
        <option value="2">bg2</option>
        <option value="3">bg3</option>
        <option value="4">bg4</option>
      </select>
    </div>
    <div class="group">
      <div class="row"><input type="checkbox" id="heroOn" checked /><label for="heroOn">显示背景轮播</label></div>
    </div>
    <div class="grid2">
      <div class="group">
        <label>标题渐变·起 <span class="val" id="v-gradA"></span></label>
        <input type="color" id="gradA" value="#bd34fe" />
      </div>
      <div class="group">
        <label>标题渐变·止 <span class="val" id="v-gradB"></span></label>
        <input type="color" id="gradB" value="#41d1ff" />
      </div>
    </div>

    <h2>正文排版</h2>
    <div class="group">
      <label>正文字号 <span class="val" id="v-fontSize">16px</span></label>
      <input type="range" id="fontSize" min="13" max="19" step="1" value="16" />
    </div>
    <div class="group">
      <label>行高 <span class="val" id="v-lineHeight">1.75</span></label>
      <input type="range" id="lineHeight" min="1.4" max="2.2" step="0.05" value="1.75" />
    </div>
    <div class="group">
      <label>内容宽度 <span class="val" id="v-contentWidth">688px</span></label>
      <input type="range" id="contentWidth" min="600" max="1200" step="8" value="688" />
      <div class="desc">文章正文区域最大宽度</div>
    </div>

    <h2>导出</h2>
    <div class="actions">
      <button class="primary" id="copy">复制 CSS</button>
      <button id="reset">恢复默认</button>
    </div>
    <textarea id="output" readonly></textarea>
    <div class="desc">粘贴到 docs/.vitepress/theme/style.css 顶部「视觉设置区」即可全站生效</div>
  </aside>

  <section class="preview">
    <div class="bar">
      预览页面
      <select id="pageSel">
        <option value="../">首页</option>
        <option value="../blog/">博客列表</option>
        <option value="../blog/posts/2026/hello-world">文章页</option>
        <option value="../blog/tags">标签页</option>
        <option value="../blog/archives">档案页</option>
        <option value="../blog/authors/jkpa">作者页</option>
      </select>
    </div>
    <iframe id="frame" src="../"></iframe>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const DEFAULTS = {
  brand: '#646cff', opacity: 0.22, speed: 32, radius: 16, hero: '1', heroOn: true,
  gradA: '#bd34fe', gradB: '#41d1ff',
  fontSize: 16, lineHeight: 1.75, contentWidth: 688, navHeight: 64,
  modes: {
    light: { bg: '#ffffff', bgAlt: '#f6f6f7', text: '#3c3c43', navBg: '#ffffff' },
    dark: { bg: '#1b1b1f', bgAlt: '#202127', text: '#ffffff', navBg: '#1b1b1f' },
  },
};

const state = JSON.parse(JSON.stringify(DEFAULTS));
state.colorMode = 'light';

const $ = (id) => document.getElementById(id);
const frame = $('frame');
const out = $('output');
const toast = $('toast');

const inputs = {
  brand: $('brand'), opacity: $('opacity'), speed: $('speed'), radius: $('radius'),
  hero: $('hero'), heroOn: $('heroOn'), gradA: $('gradA'), gradB: $('gradB'),
  fontSize: $('fontSize'), lineHeight: $('lineHeight'), contentWidth: $('contentWidth'),
  navHeight: $('navHeight'), cBg: $('cBg'), cBgAlt: $('cBgAlt'), cText: $('cText'), cNavBg: $('cNavBg'),
};

const COLOR_KEYS = { cBg: 'bg', cBgAlt: 'bgAlt', cText: 'text', cNavBg: 'navBg' };

function syncColorInputs() {
  const m = state.modes[state.colorMode];
  const vals = [m.bg, m.bgAlt, m.text, m.navBg];
  ['cBg', 'cBgAlt', 'cText', 'cNavBg'].forEach((id, i) => { inputs[id].value = vals[i]; });
  ['v-bg', 'v-bgAlt', 'v-text', 'v-navBg'].forEach((id, i) => { $(id).textContent = vals[i]; });
}

function buildCss() {
  const l = state.modes.light;
  const d = state.modes.dark;
  return `:root {
  --jkpa-brand: ${state.brand};
  --jkpa-font-size: ${state.fontSize}px;
  --jkpa-line-height: ${state.lineHeight};
  --jkpa-content-width: ${state.contentWidth}px;
  --jkpa-nav-height: ${state.navHeight}px;
  --jkpa-bg-opacity: ${state.heroOn ? state.opacity : 0};
  --jkpa-bg-speed: ${state.speed}s;
  --jkpa-radius: ${state.radius}px;
  --jkpa-hero-grad-a: ${state.gradA};
  --jkpa-hero-grad-b: ${state.gradB};
  --jkpa-bg: ${l.bg};
  --jkpa-bg-alt: ${l.bgAlt};
  --jkpa-text: ${l.text};
  --jkpa-nav-bg: ${l.navBg};
}
html.dark {
  --jkpa-bg: ${d.bg};
  --jkpa-bg-alt: ${d.bgAlt};
  --jkpa-text: ${d.text};
  --jkpa-nav-bg: ${d.navBg};
}`;
}

function renderLabels() {
  $('v-brand').textContent = state.brand;
  $('v-opacity').textContent = state.opacity.toFixed(2);
  $('v-speed').textContent = state.speed + 's';
  $('v-radius').textContent = state.radius + 'px';
  $('v-navHeight').textContent = state.navHeight + 'px';
  $('v-fontSize').textContent = state.fontSize + 'px';
  $('v-lineHeight').textContent = state.lineHeight.toFixed(2);
  $('v-contentWidth').textContent = state.contentWidth + 'px';
  $('v-gradA').textContent = state.gradA;
  $('v-gradB').textContent = state.gradB;
  syncColorInputs();
}

function apply() {
  renderLabels();
  out.value = buildCss();
  const doc = frame.contentDocument;
  if (!doc || !doc.head) return;

  let style = doc.getElementById('jkpa-studio');
  if (!style) {
    style = doc.createElement('style');
    style.id = 'jkpa-studio';
    doc.head.appendChild(style);
  }
  style.textContent = buildCss() + (state.heroOn ? '' : '\n.VPHero .container::before { display: none !important; }');

  const img = doc.querySelector('.VPHero .image-container img');
  if (img) img.setAttribute('src', '/jkpa/images/bg' + state.hero + '.jpg');

  doc.documentElement.classList.toggle('dark', state.colorMode === 'dark');
}

function bind(id, key, parse) {
  inputs[id].addEventListener('input', () => {
    state[key] = parse(inputs[id].value);
    apply();
  });
}

bind('brand', 'brand', String);
bind('opacity', 'opacity', parseFloat);
bind('speed', 'speed', parseInt);
bind('radius', 'radius', parseInt);
bind('hero', 'hero', String);
bind('gradA', 'gradA', String);
bind('gradB', 'gradB', String);
bind('fontSize', 'fontSize', parseInt);
bind('lineHeight', 'lineHeight', parseFloat);
bind('contentWidth', 'contentWidth', parseInt);
bind('navHeight', 'navHeight', parseInt);
inputs.heroOn.addEventListener('change', () => { state.heroOn = inputs.heroOn.checked; apply(); });

Object.entries(COLOR_KEYS).forEach(([id, key]) => {
  inputs[id].addEventListener('input', () => {
    state.modes[state.colorMode][key] = inputs[id].value;
    apply();
  });
});

document.querySelectorAll('.swatches button').forEach((b) => {
  b.addEventListener('click', () => { state.brand = b.dataset.color; inputs.brand.value = b.dataset.color; apply(); });
});

$('colorMode').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  state.colorMode = btn.dataset.mode;
  [...$('colorMode').children].forEach((b) => b.classList.toggle('on', b === btn));
  apply();
});

$('pageSel').addEventListener('change', (e) => { frame.src = e.target.value; });
frame.addEventListener('load', apply);

$('copy').addEventListener('click', async () => {
  apply();
  try {
    await navigator.clipboard.writeText(out.value);
    show('CSS 已复制');
  } catch (err) {
    out.select();
    document.execCommand('copy');
    show('已选中，按 Ctrl+C 复制');
  }
});

$('reset').addEventListener('click', () => {
  Object.assign(state, JSON.parse(JSON.stringify(DEFAULTS)));
  state.colorMode = 'light';
  [...$('colorMode').children].forEach((b) => b.classList.toggle('on', b.dataset.mode === 'light'));
  inputs.brand.value = state.brand;
  inputs.opacity.value = state.opacity;
  inputs.speed.value = state.speed;
  inputs.radius.value = state.radius;
  inputs.gradA.value = state.gradA;
  inputs.gradB.value = state.gradB;
  inputs.fontSize.value = state.fontSize;
  inputs.lineHeight.value = state.lineHeight;
  inputs.contentWidth.value = state.contentWidth;
  inputs.navHeight.value = state.navHeight;
  inputs.heroOn.checked = true;
  apply();
  show('已恢复默认');
});

function show(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(show.t);
  show.t = setTimeout(() => toast.classList.remove('show'), 2200);
}

apply();
</script>
</body>
</html>
